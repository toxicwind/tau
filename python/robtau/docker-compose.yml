services:
  # ───────────────────────────────────────────────────────────────────────────
  # roboomp orchestrator
  #
  # NOTE: `env_file:` is INTENTIONALLY ABSENT. We never want the gh-proxy's
  # PAT (`GITHUB_TOKEN` in .env) to leak into this container's environment.
  # Every variable below is an explicit allowlist; compose still reads `.env`
  # for `${VAR}` interpolation, but only the keys listed here flow into the
  # container. Adding a new secret means an explicit compose-level decision
  # about which container is allowed to see it.
  # ───────────────────────────────────────────────────────────────────────────
  robtau:
    build:
      # pi root: gives the web-builder stage access to the workspace
      # bun.lock + catalog (web/package.json refs `catalog:` versions).
      # python/robtau/data and tau-root excludes are filtered via
      # Dockerfile.robtau.dockerignore at the context root.
      context: ../..
      dockerfile: Dockerfile.robtau
      args:
        # Tag of the pre-built tau-base image produced by `bun run tau:image`
        # (sources: pi root /Dockerfile). Override per-environment as needed.
        TAU_BASE: tau/tau:dev
    image: robtau:dev
    container_name: robtau
    # Stable hostname: os.hostname() inside the container feeds usage
    # attribution (x-tau-hostname → broker `clients.hostname`); without this
    # it reports the random docker container id.
    hostname: robtau
    # Phase B (graceful shutdown): gives the orchestrator at least
    # ROBTAU_SHUTDOWN_DRAIN_TIMEOUT_SECONDS + ROBTAU_SHUTDOWN_KILL_TIMEOUT_SECONDS
    # before SIGKILL. Defaults: 25 + 5 = 30s.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      # --- gh-proxy channel ---
      # The orchestrator NEVER holds GITHUB_TOKEN; it talks to the sibling
      # gh-proxy container over the internal-only network.
      ROBTAU_GH_PROXY_URL: http://gh-proxy:8081
      ROBTAU_GH_PROXY_HMAC_KEY: ${ROBTAU_GH_PROXY_HMAC_KEY:?ROBTAU_GH_PROXY_HMAC_KEY must be set in .env}

      # --- webhook + identity ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBTAU_BOT_LOGIN: ${ROBTAU_BOT_LOGIN:?ROBTAU_BOT_LOGIN must be set in .env}
      ROBTAU_GIT_AUTHOR_NAME: ${ROBTAU_GIT_AUTHOR_NAME:-}
      ROBTAU_GIT_AUTHOR_EMAIL: ${ROBTAU_GIT_AUTHOR_EMAIL:?ROBTAU_GIT_AUTHOR_EMAIL must be set in .env}
      ROBTAU_REPO_ALLOWLIST: ${ROBTAU_REPO_ALLOWLIST:?ROBTAU_REPO_ALLOWLIST must be set in .env}
      ROBTAU_MAINTAINER_LOGINS: ${ROBTAU_MAINTAINER_LOGINS:-}
      ROBTAU_REVIEWER_BOTS: ${ROBTAU_REVIEWER_BOTS:-}

      # --- PR review ---
      ROBTAU_PR_REVIEW_ENABLED: ${ROBTAU_PR_REVIEW_ENABLED:-true}

      # --- release sentinel ---
      ROBTAU_RELEASE_SENTINEL_ENABLED: ${ROBTAU_RELEASE_SENTINEL_ENABLED:-false}
      ROBTAU_RELEASE_COMMIT_PREFIX: "${ROBTAU_RELEASE_COMMIT_PREFIX:-chore: bump version to }"
      ROBTAU_RELEASE_MAX_ROUNDS: ${ROBTAU_RELEASE_MAX_ROUNDS:-5}
      ROBTAU_RELEASE_TASK_TIMEOUT_SECONDS: ${ROBTAU_RELEASE_TASK_TIMEOUT_SECONDS:-3600}
      ROBTAU_RELEASE_MODEL: ${ROBTAU_RELEASE_MODEL:-}

      # --- model selection ---
      ROBTAU_MODEL: ${ROBTAU_MODEL:-anthropic/claude-sonnet-4-6}
      ROBTAU_PROVIDER: ${ROBTAU_PROVIDER:-}
      ROBTAU_THINKING: ${ROBTAU_THINKING:-high}

      # --- runtime tuning ---
      ROBTAU_MAX_CONCURRENCY: ${ROBTAU_MAX_CONCURRENCY:-8}
      ROBTAU_TASK_TIMEOUT_SECONDS: ${ROBTAU_TASK_TIMEOUT_SECONDS:-2400}
      ROBTAU_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${ROBTAU_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      ROBTAU_REQUEST_TIMEOUT_SECONDS: ${ROBTAU_REQUEST_TIMEOUT_SECONDS:-120}
      ROBTAU_RATE_LIMIT_WINDOW_SECONDS: ${ROBTAU_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ROBTAU_RATE_LIMIT_DEFAULT: ${ROBTAU_RATE_LIMIT_DEFAULT:-3}
      ROBTAU_RATE_LIMIT_CONTRIBUTOR: ${ROBTAU_RATE_LIMIT_CONTRIBUTOR:-10}
      ROBTAU_RATE_LIMIT_UNLIMITED: ${ROBTAU_RATE_LIMIT_UNLIMITED:-}
      ROBTAU_QUESTION_AUTOCLOSE_ENABLED: ${ROBTAU_QUESTION_AUTOCLOSE_ENABLED:-true}
      ROBTAU_QUESTION_AUTOCLOSE_HOURS: ${ROBTAU_QUESTION_AUTOCLOSE_HOURS:-4}
      ROBTAU_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${ROBTAU_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      ROBTAU_REPLAY_TOKEN: ${ROBTAU_REPLAY_TOKEN:-}

      # --- container-fixed paths ---
      ROBTAU_OMP_COMMAND: tau
      ROBTAU_WORKSPACE_ROOT: /data/workspaces
      ROBTAU_SQLITE_PATH: /data/robtau.sqlite
      ROBTAU_LOG_DIR: /data/logs
      ROBTAU_BIND_HOST: ${ROBTAU_BIND_HOST:-0.0.0.0}
      ROBTAU_BIND_PORT: ${ROBTAU_BIND_PORT:-8080}
      PI_ROOT: /work/pi
    depends_on:
      gh-proxy:
        condition: service_started
    # Resolve `llm-gateway.internal` (used in /srv/agent-home/.tau/agent/models.yml) to the
    # Docker host. The actual gateway listens on 127.0.0.1:4000 on the host;
    # `host-gateway` is Docker's alias for the host bridge IP.
    extra_hosts:
      - "llm-gateway.internal:host-gateway"
    networks:
      - default
      - robtau_internal
    volumes:
      - ${PI_ROOT:-../..}:/work/pi:ro
      - robtau_data:/data
      # Host agent config is mounted read-only under /srv/agent-home-stage
      # with host-controlled permissions. The entrypoint copies it into
      # root-owned, world-readable files under /srv/agent-home; the agent
      # subprocess runs with HOME=/srv/agent-home, so ~/.tau and ~/.agent
      # resolve there without exposing mutable host mounts.
      - ${HOME}/.tau/agent/models.container.yml:/srv/agent-home-stage/.tau/agent/models.yml:ro
      - ${HOME}/.agent/AGENTS.md:/srv/agent-home-stage/.agent/AGENTS.md:ro
      - ${HOME}/.agent/rules:/srv/agent-home-stage/.agent/rules:ro
    ports:
      - "0.0.0.0:6543:8080"

  # ───────────────────────────────────────────────────────────────────────────
  # gh-proxy
  #
  # The only container that ever holds GITHUB_TOKEN. Reachable only from the
  # orchestrator on the internal-only network — no host port mapping. Every
  # request must carry a valid HMAC signature (ROBTAU_GH_PROXY_HMAC_KEY).
  # `env_file:` is INTENTIONALLY ABSENT for the same reason: the explicit
  # allowlist below is the only place where any var lands in this container.
  # ───────────────────────────────────────────────────────────────────────────
  gh-proxy:
    image: robtau:dev
    container_name: gh-proxy
    restart: unless-stopped
    command: ["python", "-m", "robtau.proxy", "serve"]
    environment:
      # PAT: lives ONLY here. The orchestrator's compose block refuses to
      # let this var into its container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set in .env}
      # Shared with the orchestrator: HMAC verification key.
      ROBTAU_GH_PROXY_HMAC_KEY: ${ROBTAU_GH_PROXY_HMAC_KEY:?ROBTAU_GH_PROXY_HMAC_KEY must be set in .env}
      # The proxy reuses the SandboxManager pool layout under /data/workspaces.
      ROBTAU_WORKSPACE_ROOT: /data/workspaces
      ROBTAU_SQLITE_PATH: /data/robtau.sqlite
      ROBTAU_LOG_DIR: /data/logs
      # Bind on the internal network only.
      ROBTAU_GH_PROXY_BIND_HOST: 0.0.0.0
      ROBTAU_GH_PROXY_BIND_PORT: 8081
      # Settings still requires these on construction; the proxy never uses
      # them but the validator runs the same code path as the orchestrator.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBTAU_BOT_LOGIN: ${ROBTAU_BOT_LOGIN:?ROBTAU_BOT_LOGIN must be set in .env}
      ROBTAU_GIT_AUTHOR_EMAIL: ${ROBTAU_GIT_AUTHOR_EMAIL:?ROBTAU_GIT_AUTHOR_EMAIL must be set in .env}
      ROBTAU_REPO_ALLOWLIST: ${ROBTAU_REPO_ALLOWLIST:?ROBTAU_REPO_ALLOWLIST must be set in .env}
    networks:
      # `default` gives gh-proxy outbound NAT to api.github.com; `robtau_internal`
      # is how the orchestrator reaches it. No `ports:` mapping → still
      # unreachable from the host or any sibling project.
      - default
      - robtau_internal
    volumes:
      # Shared workspace pool/worktrees so the proxy can drive git operations
      # against the same per-issue worktrees the orchestrator builds.
      - robtau_data:/data

networks:
  # External-facing bridge: webhook ingress (8080) and the orchestrator's
  # outbound path to the host LLM gateway via extra_hosts.
  default: {}
  # Orchestrator <-> gh-proxy only. internal: true means no egress and no
  # ingress from outside the compose project.
  robtau_internal:
    internal: true

volumes:
  # Docker-managed Linux volume so UID/GID permissions on /data are enforced.
  robtau_data: {}
