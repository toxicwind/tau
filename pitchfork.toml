--
# buildsrv - fleet continuous-modification engine (2026-09-14): disk-backed
# job queue, streaming logs, content-hash artifact cache. Source:
# tools/buildsrv in toxicwind/sovereign-projects. Submit via the buildsrv CLI.
# NOTE: pitchfork.toml is hand-edited (generator retired 2026-09-14, never run it).
[daemons.buildsrv]
port = 25148
run = "exec /usr/bin/python3 /home/toxic/sovereign/tools/buildsrv/buildsrvd.py"
dir = "/home/toxic/sovereign/tools/buildsrv"
mise = false
retry = true
boot_start = true
--
# Build-cache env (2026-09-21): every buildsrv job inherits these. sccache/ccache/uv caches live on NVMe.
# CARGO_INCREMENTAL=0 because sccache refuses incremental compilation outright.
# CC/CXX intentionally NOT set: BASH_ENV rewrites them to clang for bash -lc jobs,
# so CMAKE compiler launchers are the robust ccache path for CMake builds.
--
env = { BUILDSRV_ROOT = "/home/toxic/buildsrv", BUILDSRV_PORT = "25148", BUILDSRV_WORKERS = "2", RUSTC_WRAPPER = "sccache", SCCACHE_DIR = "/home/toxic/.cache/sccache", CCACHE_DIR = "/home/toxic/.cache/ccache", CMAKE_C_COMPILER_LAUNCHER = "ccache", CMAKE_CXX_COMPILER_LAUNCHER = "ccache", UV_CACHE_DIR = "/home/toxic/.cache/uv", CARGO_INCREMENTAL = "0" }
auto = ["start"]

# buildsrv-watchdog - external liveness guard for buildsrv (2026-09-14):
# polls /health every 20s; `pitchfork restart buildsrv` after 3 consecutive
